spring.application.name=sharepoint
server.port=${APP_PORT:8080}

# Exception Handling
spring.web.resources.add-mappings=true
spring.mvc.throw-exception-if-no-handler-found=false
server.error.whitelabel.enabled=false

# SpringDoc / Swagger
springdoc.show-hateoas-endpoints=false

# Logging
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [req=%X{requestId:-?}] [ip=%X{clientIp:-?}] [job=%X{jobId:-?}] %-36.36logger{35} : %msg%n
logging.level.root=INFO
logging.level.org.migration.sharepoint=DEBUG
logging.level.com.zaxxer.hikari=WARN
logging.level.org.hibernate=WARN
logging.level.org.quartz=WARN

# Jackson
spring.jackson.default-property-inclusion=non_null

# Rate Limiting
security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}

# Microsoft Graph API
graph.base-url=https://graph.microsoft.com/v1.0
graph.tenant-id=${GRAPH_TENANT_ID:}
graph.client-id=${GRAPH_CLIENT_ID:}
graph.client-secret=${GRAPH_CLIENT_SECRET:}

# Migration Writer
writer.batch-size=${WRITER_BATCH_SIZE:500}

# Quartz
spring.quartz.job-store-type=memory
spring.quartz.auto-startup=true
spring.quartz.overwrite-existing-jobs=true

# SQLite
spring.datasource.url=jdbc:sqlite:./main/resources/sharepoint.db?journal_mode=WAL&busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-timeout=10000
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# External Auth Server
auth.server.url=${AUTH_SERVER_URL:http://localhost:8080}

# CORS Configuration
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Dev Mode (Forward Auth Mock)
security.dev-mode.enabled=${DEV_MODE_ENABLED:false}
security.dev-mode.user-email=${DEV_MODE_USER_EMAIL:dev@localhost}
security.dev-mode.user-id=${DEV_MODE_USER_ID:00000000-0000-0000-0000-000000000001}
